[workspace]
resolver = "3"
members = ["crates/runtime", "crates/server", "crates/cli", "examples/hello", "examples/http-hello", "examples/chaos", "examples/counter", "examples/fetch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
edgebox-runtime = { path = "crates/runtime" }
edgebox-server = { path = "crates/server" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
hyper = "1"
tokio = "1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
ureq = "3"
wasi = "0.14"
wit-bindgen = "0.63"
wasmtime = "50"
wasmtime-wasi = "50"
wasmtime-wasi-http = "50"

# Keep debug builds small: line tables for our crates, no debug info for deps.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
