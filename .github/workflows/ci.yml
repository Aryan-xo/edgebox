name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Build example guests
        run: cargo guests

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Smoke test CLI
        run: |
          out=$(cargo run -q -p edgebox -- run target/wasm32-wasip2/release/hello.wasm)
          echo "$out"
          test "$out" = "Hello from WASM!"

      - name: Smoke test HTTP server
        run: |
          ./target/debug/edgebox serve --data :memory: hello=target/wasm32-wasip2/release/http_hello.wasm &
          for i in $(seq 1 50); do out=$(curl -sf localhost:8080/hello) && break; sleep 0.2; done
          echo "$out"
          test "$out" = "Hello from WASM! You requested /hello"
