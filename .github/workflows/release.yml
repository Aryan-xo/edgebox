name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p edgebox --target ${{ matrix.target }}

      - name: Package
        run: |
          name=edgebox-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/edgebox README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"

      - uses: softprops/action-gh-release@v2
        with:
          files: edgebox-*.tar.gz
          generate_release_notes: true
